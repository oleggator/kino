name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Handles the Gradle distribution and the dependency cache.
      - uses: gradle/actions/setup-gradle@v6

      # assembleRelease rather than Debug, for two separate reasons: R8 runs (16 MB ->
      # 2.3 MB) and debuggable is off, which is what makes Compose smooth on a TV. It
      # signs with the debug key, which the runner generates fresh each time — so a CI
      # build installs over a previous CI build, but not over one built locally.
      - run: ./gradlew test assembleRelease

      # archive: false (v7+) uploads the APK as-is rather than wrapping it in a zip,
      # so the download is installable straight away. It takes a single file only, and
      # that file's own name becomes the artifact name — `name` is ignored here, which
      # is why it is not set. The artifact appears on the run as app-release.apk.
      - uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error

      # Left zipped: this one is a directory, which archive: false cannot take.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
