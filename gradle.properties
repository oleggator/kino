org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# This machine's default JDK is 26; AGP 8.10 needs 17-21. Drop this line if your
# JAVA_HOME already points at a supported JDK — .github/workflows/build.yml deletes it
# on the runner for exactly that reason, since this path exists on no machine but one.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk
